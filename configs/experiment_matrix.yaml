experiments:
- name: exp1_qwen3_1_7b_tldr
  ann_modes:
  - vanilla
  - unaware
  - phase_aware
  - gif_aware
  config:
    experiment:
      id: snn2_main_v1
      output_root: artifacts
      seed: 42
      trust_remote_code: false
      task: tldr
      model_name: Qwen/Qwen3-1.7B-Base
      model_revision: ea980cb
    data:
      max_seq_length: 2048
      truncation: true
      truncation_side: right
      packing: false
      dataset_name: trl-lib/tldr
      dataset_revision: 21233da376667088e6eb1ce4ce19ed832c2935d3
      train_split: train
      validation_split: validation
      evaluation_split: test
    rotation:
      enabled: true
      seed: 42
      fusion_device: cuda
      implementation: fused_weights_plus_online_R3_R4
      fused_weights_are_finetuned: true
      regression_relative_l2_threshold: 0.05
      regression_top1_agreement_threshold: 0.95
    prefix:
      enabled: true
      outlier_threshold: 64.0
      detection_activation: down_proj_input
      loss_masked: true
    ann_training:
      prefix_enabled: true
    post_finetuning:
      rediscover_prefix: true
      recalibrate_sites: true
      prefix_enabled: true
      post_finetuning_recalibration: true
    calibration:
      seed: 42
      num_samples: 128
      with_replacement: false
      batch_size: 1
      group_size: 128
      expected_sites_per_layer: 10
      device_map: auto
    deployment:
      temporal_implementation: sparse_llm_temporal_v8_final_norm_phase_mtn_ema_clamp
      temporal_layout: time_major_flattened_TB
      linear_bias_policy: first_timestep_once
      prefix_temporal_policy: uniform_kv_divide_by_T
      embedding_temporal_policy: uniform_embedding_divide_by_T
      softmax_prefix_neuron_policy: full_softmax_tensor_including_prefix
      softmax_site5_gif_policy: spikellm_nbits16_sentinel_identity
      final_norm_neuron_policy: phase_ann_surrogate_phase_snn_temporal_mtn_snn_temporal_gif_identity_clip_forbidden_v1
      phase_tau_calibration: ema_channel_abs_max_then_group_max
      phase_tau_ema_factor: 0.99
      phase_tau_accumulator_dtype: float32
    phase:
      T: 6
      base: 2.0
      surrogate_slope: 1.0
      timestep_indexing: t_0_to_T_minus_1
      threshold_rule: "tau * base ** (-(t + 1))"
    mtn:
      T: 6
      K: 8
      threshold_factor: 0.75
    gif:
      base_bits: 4
      add_bits: 1
      high_qmax: 30
      temporal_steps: 2
      per_step_qmax: 15
      low_ratio: 0.9
      salient_ratio: 0.1
      scale_initialization: direct_min_max
      mse_scale_refinement: false
      runtime_quantization: static
      saliency_rule: operator_aware_spikellm_extension
    replacement:
      train_mode: phase
      common_clip_enabled: true
      outer_clip_backward: hard_clip
      clip_rule: phase_mtn_gif_low_high_common_intersection
    rotated_pre_finetuning:
      prefix_enabled: true
    training:
      num_train_epochs: 1
      per_device_train_batch_size: 1
      per_device_eval_batch_size: 1
      gradient_accumulation_steps: 16
      learning_rate: 5.0e-05
      weight_decay: 0.0
      adam_beta1: 0.9
      adam_beta2: 0.999
      adam_epsilon: 1.0e-08
      lr_scheduler_type: cosine
      warmup_ratio: 0.0
      bf16: true
      fp16: false
      dtype: bfloat16
      max_grad_norm: 1.0
      gradient_checkpointing: false
      attn_implementation: eager
      flash_attention: false
      eval_strategy: 'no'
      save_strategy: 'no'
      load_best_model_at_end: false
      logging_steps: 10
      deepspeed_config: configs/deepspeed_zero3.json
      resume_from_checkpoint: null
      tldr_train_samples: 10000
      tldr_train_seed: 42
    evaluation:
      prefix_enabled: true
      batch_size: 8
      max_new_tokens: 32
      tldr_input_length: 512
      tldr_test_samples: 1000
      tldr_test_seed: 42
      rouge_types:
      - rouge1
      - rouge2
      - rougeL
      - rougeLsum
      limit: null
      lm_eval_revision: 6d2abda4fd171e68a8789330c4149e37c1ca0bda
      apply_chat_template: true
      lm_eval_task_specs:
      - name: truthfulqa_mc1
        num_fewshot: 6
        metric: acc_mc1
        cot: true
      - name: mmlu_pro
        num_fewshot: 0
        metric: exact_match
        cot: false
      - name: bbh
        num_fewshot: 3
        metric: exact_match
        cot: false
      - name: agieval
        num_fewshot: 0
        metric: acc
        cot: false
      - name: gsm8k_cot
        num_fewshot: 8
        metric: exact_match
        cot: true
      - name: minerva_math
        num_fewshot: 4
        metric: exact_match
        cot: false
